changes:
  - section: "Features Added"
    description: "Added three IoT Hub message-routing troubleshooting commands. `azmcp iothub routing endpoint-health` returns the default endpoint type and health values and includes endpoint-aware latency threshold violations; `azmcp iothub routing endpoint-latency` returns active-bucket average and peak routing latency, the applied threshold, send-to-success latency, and a configurable trend; and `azmcp iothub routing endpoint-diagnose` runs a per-target-resource Azure Monitor deep dive, inspects supported target configuration such as Storage firewall settings, and returns fault attribution, user-friendly evidence, and exploration commands. All three cover Event Hubs, Service Bus queues/topics, Blob Storage containers, and Cosmos DB SQL containers, support `--endpoint-name`, and accept either a relative `--lookback` or a paired absolute `--start-time` and `--end-time` range of up to 30 days. Absolute ranges take precedence over `--lookback`; latency and diagnosis retain configurable `--interval` buckets."